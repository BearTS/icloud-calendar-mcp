services:
  icloud-calendar-mcp:
    build: .
    image: icloud-calendar-mcp:latest
    container_name: icloud-calendar-mcp
    restart: unless-stopped
    environment:
      ICLOUD_USERNAME: ${ICLOUD_USERNAME:?ICLOUD_USERNAME is required}
      ICLOUD_PASSWORD: ${ICLOUD_PASSWORD:?ICLOUD_PASSWORD is required}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required}
    networks:
      - "pangolin"

networks:
  pangolin:
    external: true
    name: "pangolin"
