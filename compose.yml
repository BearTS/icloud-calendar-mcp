services:
  icloud-calendar-mcp:
    build: .
    image: icloud-calendar-mcp:latest
    container_name: icloud-calendar-mcp
    restart: unless-stopped
    environment:
      ICLOUD_USERNAME: ${ICLOUD_USERNAME:?set ICLOUD_USERNAME in .env}
      ICLOUD_PASSWORD: ${ICLOUD_PASSWORD:?set ICLOUD_PASSWORD in .env}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
    networks:
      - "pangolin"

networks:
  pangolin:
    external: true
    name: "pangolin"
